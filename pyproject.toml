[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor-clases"
version = "1.1.0"
description = "Transcripción local de videos largos con FFmpeg y Faster-Whisper, con fragmentación y reanudación."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1,<2",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
transcribir-clase = "transcriptor_clases.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
